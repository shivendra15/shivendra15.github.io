name: Update Google Scholar Data

on:
  schedule:
    # Runs every Monday at 6:00 AM UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
      - name: Install dependencies
        run: |
          pip install scholarly beautifulsoup4 requests free-proxy

      - name: Fetch Google Scholar data
        run: python scripts/fetch_scholar.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet publications/publications.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add publications/publications.json
          git commit -m "Auto-update Scholar data [$(date +'%Y-%m-%d')]"
          git push
